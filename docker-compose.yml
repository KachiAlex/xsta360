services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xsta360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xsta360_dev_pw}
      POSTGRES_DB: xsta360
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xsta360 -d xsta360"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://xsta360:${POSTGRES_PASSWORD:-xsta360_dev_pw}@db:5432/xsta360
        SESSION_SECRET: ${SESSION_SECRET}
        APP_URL: ${APP_URL:-http://67.211.210.8}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://xsta360:${POSTGRES_PASSWORD:-xsta360_dev_pw}@db:5432/xsta360
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL:-http://67.211.210.8}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Xsta360 <noreply@xsta360.app>}
      CRON_SECRET: ${CRON_SECRET:-dev}
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:

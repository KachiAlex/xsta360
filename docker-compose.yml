services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xsta360
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xsta360_dev_pw}
      POSTGRES_DB: xsta360
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Only expose to localhost for admin/backup access.
    # The app container reaches the DB over the internal Docker network.
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xsta360 -d xsta360"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgresql://xsta360:${POSTGRES_PASSWORD:-xsta360_dev_pw}@db:5432/xsta360
        SESSION_SECRET: ${SESSION_SECRET}
        APP_URL: ${APP_URL:-http://67.211.210.8}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://xsta360:${POSTGRES_PASSWORD:-xsta360_dev_pw}@db:5432/xsta360
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL:-http://67.211.210.8}
      EMAIL_FROM: ${EMAIL_FROM:-Xsta360 <noreply@xsta360.app>}
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CRON_SECRET: ${CRON_SECRET:-dev}
      BREVO_WEBHOOK_SECRET: ${BREVO_WEBHOOK_SECRET:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-xsta360-documents}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    ports:
      - "127.0.0.1:3009:3000"

volumes:
  pgdata:
